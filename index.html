<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>WebPython</title>
  <script>
    // GitHub Pagesなど、COOP/COEPヘッダーを設定できない静的ホスト向け。
    // Cloudflare Pages等でヘッダーを設定済みなら、何もしません。
    window.coi = {
      coepCredentialless: () => true,
      coepDegrade: () => true,
      quiet: false
    };
  </script>
  <script src="./coi-serviceworker.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">WebPython</div>
    <nav class="menu">
      <button data-action="new-file">File</button>
      <button data-action="new-folder">Folder</button>
      <button data-action="refresh">Refresh</button>
      <button data-action="import">Import</button>
      <button data-action="export">Export</button>
      <button data-action="terminal-toggle">Terminal</button>
    </nav>
    <div class="spacer"></div>
    <button id="runButton" class="run-button">▶ 実行</button>
  </header>

  <main class="workspace-shell">
    <aside class="explorer panel">
      <div class="panel-title">EXPLORER <span id="vmBadge" class="badge offline">起動中</span></div>
      <div id="fileTree" class="file-tree"></div>
      <div class="explorer-actions">
        <button data-action="new-file">＋ ファイル</button>
        <button data-action="new-folder">＋ フォルダ</button>
      </div>
    </aside>

    <section class="editor-area">
      <div id="tabs" class="tabs"></div>
      <div class="editor-toolbar">
        <span id="currentPath" class="path">/workspace/main.py</span>
        <div class="toolbar-actions">
          <button id="saveButton">保存</button>
          <button id="runToolbarButton" class="primary">▶ 実行</button>
        </div>
      </div>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
      <div class="statusbar">
        <span id="statusText">Linux準備中…</span>
        <span id="cursorText">Ln 1, Col 1</span>
      </div>
    </section>
  </main>

  <section id="terminalPanel" class="terminal-panel hidden">
    <div class="terminal-header">
      <div class="terminal-title">TERMINAL</div>
      <label class="root-toggle"><input id="rootMode" type="checkbox"> root</label>
      <button id="clearTerminal">Clear</button>
      <button id="closeTerminal">×</button>
    </div>
    <pre id="terminalOutput" class="terminal-output"></pre>
    <form id="terminalForm" class="terminal-input-row">
      <span id="terminalPrompt">$</span>
      <input id="terminalInput" autocomplete="off" spellcheck="false" placeholder="command…">
    </form>
  </section>

  <div id="toast" class="toast"></div>
  <input id="folderInput" type="file" webkitdirectory directory multiple hidden>

  <script type="module" src="./app.js?v=5"></script>
</body>
</html>
